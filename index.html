<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>推し活！ファンサゲーム</title>
    <style>
        /* 背景を黒に変更し、光の粒のアニメーションを追加 */
        body { 
            font-family: 'Hiragino Kaku Gothic ProN', sans-serif; 
            text-align: center; 
            background: #000; /* 真っ黒な背景 */
            margin: 0; 
            overflow: hidden; 
            color: #fff;
        }
        
        #game-container { 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
        }

        /* ペンライトの光の粒 */
        .light {
            position: absolute;
            border-radius: 50%;
            filter: blur(15px); /* ボヤけ具合 */
            opacity: 0.6;
            animation: float 8s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-40px) translateX(20px); }
        }

        /* オープニング画面 */
        #opening-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center;
            flex-direction: column; z-index: 200;
        }
        #opening-screen h1 { font-size: 36px; color: #fbc02d; text-shadow: 0 0 10px rgba(251, 192, 45, 0.5); margin-bottom: 5px; }
        #opening-screen h2 { font-size: 20px; color: #f9a825; margin: 0; }
        #opening-screen h3 { font-size: 14px; color: #ccc; margin: 10px 0 25px; padding: 0 20px; }

        /* 流れるファン */
        #fan-container { 
            position: absolute; top: 15%; right: -200px; 
            font-size: 100px;
            transition: right 1.2s ease-out; z-index: 5;
            filter: drop-shadow(0 0 10px rgba(0, 150, 255, 0.8)) invert(48%) sepia(79%) saturate(2476%) hue-rotate(186deg) brightness(118%) contrast(119%);
        }
        
        /* 固定のアイドル */
        #idol-static { 
            position: absolute; bottom: 25%; left: 50%; transform: translateX(-50%);
            width: 220px; z-index: 10;
        }
        #idol-img { width: 100%; height: auto; display: block; }

        /* 反応エフェクト */
        #fan-reaction {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            font-size: 50px; display: none; z-index: 16;
        }
        
        #fan-speech {
            position: absolute; top: 8%; right: -200px;
            background: white; border: 3px solid #fbc02d; padding: 8px 16px;
            border-radius: 20px; font-weight: bold; font-size: 18px; color: #333; display: none; z-index: 15;
            white-space: nowrap; transition: right 1.2s ease-out;
        }

        /* 選択肢のUI */
        #ui-layer { 
            position: absolute; bottom: 4%; left: 5%; width: 90%; 
            background: rgba(255, 255, 255, 0.9); padding: 12px 0;
            border: 4px solid #fbc02d; border-radius: 20px; display: none; z-index: 20;
        }
        #ui-layer p { color: #f9a825; }
        .btn { 
            display: inline-block; margin: 5px; padding: 10px 15px; background: #fbc02d; 
            color: white; border-radius: 12px; cursor: pointer; font-size: 16px; border: none;
            font-weight: bold; box-shadow: 0 4px 0 #f9a825;
        }
        .btn:active { transform: translateY(3px); box-shadow: none; }

        #pose-display {
            position: absolute; bottom: 45%; left: 50%; transform: translateX(-50%); 
            font-size: 80px; z-index: 12; pointer-events: none; text-shadow: 0 0 15px rgba(255,255,255,0.8);
        }

        #result-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a; justify-content: center; align-items: center;
            flex-direction: column; z-index: 100;
        }
        #result-screen h1 { font-size: 36px; color: #fbc02d; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="light" style="width: 80px; height: 80px; background: #ff1744; top: 20%; left: 10%; animation-delay: 0s;"></div>
    <div class="light" style="width: 100px; height: 100px; background: #00e676; top: 50%; left: 80%; animation-delay: 1s;"></div>
    <div class="light" style="width: 70px; height: 70px; background: #2979ff; top: 70%; left: 15%; animation-delay: 2s;"></div>
    <div class="light" style="width: 90px; height: 90px; background: #ffea00; top: 30%; left: 70%; animation-delay: 3s;"></div>
    <div class="light" style="width: 110px; height: 110px; background: #d500f9; top: 60%; left: 40%; animation-delay: 4s;"></div>

    <div id="opening-screen">
        <h1>推し活！<br>ファンサゲーム</h1>
        <h2>めざせ神アイドル！</h2>
        <h3>あなたはライブ中のアイドル。<br>完璧なファンサをしてください</h3>
        <button class="btn" style="font-size: 24px; padding: 15px 40px;" onclick="startGame()">ライブスタート！</button>
    </div>

    <div id="fan-container">👤</div>
    <div id="fan-speech"></div>

    <div id="idol-static">
        <img id="idol-img" src="" alt="idol">
    </div>
    
    <div id="pose-display"></div>
    <div id="fan-reaction"></div>

    <div id="ui-layer">
        <p style="margin: 0 0 10px 0; font-weight: bold; font-size: 14px;">ファンにファンサをして！</p>
        <div id="options"></div>
    </div>

    <div id="result-screen">
        <h1 id="rank-title"></h1>
        <p id="rank-desc" style="font-size: 20px;"></p>
        <button class="btn" onclick="location.reload()">もう一度ライブへ！</button>
    </div>
</div>

<script>
const fanContainer = document.getElementById('fan-container');
const fanSpeech = document.getElementById('fan-speech');
const idolImg = document.getElementById('idol-img');
const fanReaction = document.getElementById('fan-reaction');
const uiLayer = document.getElementById('ui-layer');
const optionsDiv = document.getElementById('options');
const poseDisplay = document.getElementById('pose-display');
const openingScreen = document.getElementById('opening-screen');

const idolImages = ["idol_man.png", "idol_woman.png"];

const poses = [
    { name: "ハートして！", icon: "🫶 ハート", emoji: "🫶" },
    { name: "ピースして！", icon: "✌️ ピース", emoji: "✌️" },
    { name: "手振って！", icon: "👋 手を振る", emoji: "👋" },
    { name: "OKポーズして！", icon: "👌 OK", emoji: "👌" }
];

let round = 0;
let score = 0;

function startGame() {
    const randomIdolIndex = Math.floor(Math.random() * idolImages.length);
    idolImg.src = idolImages[randomIdolIndex];
    openingScreen.style.display = "none";
    startRound();
}

function startRound() {
    if (round >= 5) {
        showResult();
        return;
    }

    fanContainer.style.transition = "none";
    fanSpeech.style.transition = "none";
    fanContainer.style.right = "-200px";
    fanSpeech.style.right = "-200px";
    
    poseDisplay.innerText = "";
    fanSpeech.style.display = "none";
    fanReaction.style.display = "none";
    uiLayer.style.display = "none";

    setTimeout(() => {
        fanContainer.style.transition = "right 1.2s ease-out";
        fanSpeech.style.transition = "right 1.2s ease-out";
        fanContainer.style.right = "calc(50% - 50px)";
        fanSpeech.style.right = "calc(50% - 80px)";
        
        setTimeout(() => {
            const currentQuest = poses[Math.floor(Math.random() * poses.length)];
            fanSpeech.innerText = currentQuest.name;
            fanSpeech.style.display = "block";
            showOptions(currentQuest);
        }, 1300);
    }, 100);
}

function showOptions(correct) {
    uiLayer.style.display = "block";
    optionsDiv.innerHTML = "";
    
    let choices = [...poses].sort(() => 0.5 - Math.random()).slice(0, 3);
    if (!choices.some(c => c.name === correct.name)) choices[0] = correct;
    
    choices.sort(() => 0.5 - Math.random()).forEach(choice => {
        const btn = document.createElement('button');
        btn.className = "btn";
        btn.innerText = choice.icon;
        btn.onclick = () => checkAnswer(choice, correct);
        optionsDiv.appendChild(btn);
    });
}

function checkAnswer(choice, correct) {
    uiLayer.style.display = "none";
    poseDisplay.innerText = choice.emoji; 
    
    if (choice.name === correct.name) {
        score++;
        fanReaction.innerText = "💛"; 
    } else {
        fanReaction.innerText = "🌀"; 
    }
    fanReaction.style.display = "block";

    setTimeout(() => {
        fanSpeech.style.display = "none";
        fanReaction.style.display = "none";
        fanContainer.style.transition = "right 1.2s ease-in";
        fanSpeech.style.transition = "right 1.2s ease-in";
        fanContainer.style.right = "120%"; 
        fanSpeech.style.right = "120%"; 
        
        setTimeout(() => {
            round++;
            startRound();
        }, 1300);
    }, 1200);
}

function showResult() {
    const screen = document.getElementById('result-screen');
    const title = document.getElementById('rank-title');
    let rank = "";

    if (score === 5) rank = "神ファンサ";
    else if (score === 4) rank = "なかなかのファンサ";
    else if (score === 2 || score === 3) rank = "可もなく不可もないファンサ";
    else if (score === 1) rank = "ファンサ初心者";
    else rank = "一般人";

    title.innerText = rank;
    document.getElementById('rank-desc').innerText = `全5問中 ${score}問 正解！`;
    screen.style.display = "flex";
}
</script>
</body>
</html>
