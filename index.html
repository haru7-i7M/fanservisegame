<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>推し活！ファンサゲーム</title>
    <style>
        /* 全体のテーマカラー：黄色ベース */
        body { font-family: 'Hiragino Kaku Gothic ProN', sans-serif; text-align: center; background: #fffde7; margin: 0; overflow: hidden; }
        #game-container { width: 100vw; height: 100vh; position: relative; background: linear-gradient(#fff9c4, #ffffff); }
        
        /* オープニング画面：スマホ向けにフォントサイズ調整 */
        #opening-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fffde7; display: flex; justify-content: center; align-items: center;
            flex-direction: column; z-index: 200;
        }
        #opening-screen h1 { font-size: 40px; color: #fbc02d; text-shadow: 2px 2px 0 white; margin-bottom: 10px; }
        #opening-screen h2 { font-size: 22px; color: #f9a825; margin-top: 0; margin-bottom: 30px; }

        /* 推し（アイドル）：スマホ向けに少し小さくし、位置を調整 */
        #idol-container { 
            position: absolute; top: 10%; right: -300px; 
            width: 240px; 
            transition: right 1.2s ease-out; z-index: 5;
        }
        #idol-img {
            width: 100%; height: auto;
            display: block;
        }
        
        /* ファン（手前の人）：位置を少し上に */
        #fan { 
            position: absolute; bottom: 28%; left: 50%; transform: translateX(-50%);
            font-size: 80px; z-index: 10;
            filter: invert(48%) sepia(79%) saturate(2476%) hue-rotate(186deg) brightness(118%) contrast(119%);
        }

        /* 反応エフェクト */
        #fan-reaction {
            position: absolute; bottom: 38%; left: 50%; transform: translateX(-50%);
            font-size: 50px; display: none; z-index: 16;
        }
        
        /* ファンの吹き出し：スマホで見やすいサイズ */
        #fan-speech {
            position: absolute; bottom: 46%; left: 50%; transform: translateX(-50%);
            background: white; border: 3px solid #fbc02d; padding: 8px 16px;
            border-radius: 20px; font-weight: bold; font-size: 18px; display: none; z-index: 15;
            white-space: nowrap;
        }

        /* 選択肢のUI：画面下部から少し浮かせて、親指で押しやすく [修正] */
        #ui-layer { 
            position: absolute; bottom: 4%; left: 5%; width: 90%; 
            background: rgba(255, 255, 255, 0.95); padding: 15px 0;
            border: 4px solid #fbc02d; border-radius: 20px; display: none; z-index: 20;
        }
        .btn { 
            display: inline-block; margin: 5px; padding: 12px 18px; background: #fbc02d; 
            color: white; border-radius: 12px; cursor: pointer; font-size: 16px; border: none;
            font-weight: bold; box-shadow: 0 4px 0 #f9a825;
        }
        .btn:active { transform: translateY(3px); box-shadow: none; }

        /* ポーズ表示 */
        #pose-display {
            position: absolute; top: 25%; left: 50%; transform: translateX(-50%); 
            font-size: 100px; z-index: 12; pointer-events: none;
        }

        /* 結果表示 */
        #result-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; justify-content: center; align-items: center;
            flex-direction: column; z-index: 100;
        }
        #result-screen h1 { font-size: 36px; color: #fbc02d; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="opening-screen">
        <h1>推し活！ファンサゲーム</h1>
        <h2>めざせ神アイドル！</h2>
        <button class="btn" style="font-size: 24px; padding: 15px 40px;" onclick="startGame()">ライブスタート！</button>
    </div>

    <div id="idol-container">
        <img id="idol-img" src="" alt="idol">
    </div>
    
    <div id="pose-display"></div>
    <div id="fan-speech"></div>
    <div id="fan-reaction"></div>
    <div id="fan">👤</div>

    <div id="ui-layer">
        <p style="margin: 0 0 10px 0; font-weight: bold; color: #f9a825; font-size: 14px;">ファンにファンサをして！</p>
        <div id="options"></div>
    </div>

    <div id="result-screen">
        <h1 id="rank-title"></h1>
        <p id="rank-desc" style="font-size: 20px;"></p>
        <button class="btn" onclick="location.reload()">もう一度ライブへ！</button>
    </div>
</div>

<script>
const idolContainer = document.getElementById('idol-container');
const idolImg = document.getElementById('idol-img');
const fan = document.getElementById('fan');
const fanSpeech = document.getElementById('fan-speech');
const fanReaction = document.getElementById('fan-reaction');
const uiLayer = document.getElementById('ui-layer');
const optionsDiv = document.getElementById('options');
const poseDisplay = document.getElementById('pose-display');
const openingScreen = document.getElementById('opening-screen');

// GitHubにアップロードしたファイル名に合わせてください
const idolImages = [
    "idol_man.png", 
    "idol_woman.png"
];

const poses = [
    { name: "ハートして！", icon: "🫶 ハート", emoji: "🫶" },
    { name: "ピースして！", icon: "✌️ ピース", emoji: "✌️" },
    { name: "手振って！", icon: "👋 手を振る", emoji: "👋" },
    { name: "OKポーズして！", icon: "👌 OK", emoji: "👌" }
];

let round = 0;
let score = 0;

function startGame() {
    openingScreen.style.display = "none";
    startRound();
}

function startRound() {
    if (round >= 5) {
        showResult();
        return;
    }

    const randomIdolIndex = Math.floor(Math.random() * idolImages.length);
    idolImg.src = idolImages[randomIdolIndex];

    idolContainer.style.transition = "none";
    idolContainer.style.right = "-300px"; 
    poseDisplay.innerText = "";
    fan.innerText = "👤"; 
    
    fanSpeech.style.display = "none";
    fanReaction.style.display = "none";
    uiLayer.style.display = "none";

    setTimeout(() => {
        idolContainer.style.transition = "right 1.2s ease-out";
        idolContainer.style.right = "calc(50% - 120px)"; 
        
        setTimeout(() => {
            const currentQuest = poses[Math.floor(Math.random() * poses.length)];
            fanSpeech.innerText = currentQuest.name;
            fanSpeech.style.display = "block";
            showOptions(currentQuest);
        }, 1300);
    }, 100);
}

function showOptions(correct) {
    uiLayer.style.display = "block";
    optionsDiv.innerHTML = "";
    
    let choices = [...poses].sort(() => 0.5 - Math.random()).slice(0, 3);
    if (!choices.some(c => c.name === correct.name)) choices[0] = correct;
    
    choices.sort(() => 0.5 - Math.random()).forEach(choice => {
        const btn = document.createElement('button');
        btn.className = "btn";
        btn.innerText = choice.icon;
        btn.onclick = () => checkAnswer(choice, correct);
        optionsDiv.appendChild(btn);
    });
}

function checkAnswer(choice, correct) {
    uiLayer.style.display = "none";
    poseDisplay.innerText = choice.emoji; 
    
    if (choice.name === correct.name) {
        score++;
        fanReaction.innerText = "💛"; 
    } else {
        fanReaction.innerText = "🌀"; 
    }
    fanReaction.style.display = "block";

    setTimeout(() => {
        fanSpeech.style.display = "none";
        fanReaction.style.display = "none";
        idolContainer.style.transition = "right 1.2s ease-in";
        idolContainer.style.right = "120%"; 
        
        setTimeout(() => {
            round++;
            startRound();
        }, 1300);
    }, 1200);
}

function showResult() {
    const screen = document.getElementById('result-screen');
    const title = document.getElementById('rank-title');
    let rank = "";

    if (score === 5) rank = "神ファンサ";
    else if (score === 4) rank = "なかなかのファンサ";
    else if (score === 2 || score === 3) rank = "可もなく不可もないファンサ";
    else if (score === 1) rank = "ファンサ初心者";
    else rank = "一般人";

    title.innerText = rank;
    document.getElementById('rank-desc').innerText = `全5問中 ${score}問 正解！`;
    screen.style.display = "flex";
}
</script>
</body>
</html>
